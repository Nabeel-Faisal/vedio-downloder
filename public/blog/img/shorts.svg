<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="sh-phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sh-bg)"/>

  <!-- Vertical phone shape -->
  <g transform="translate(490 110)">
    <rect width="220" height="410" rx="32" fill="#0a0a0a" stroke="#262626" stroke-width="2"/>
    <rect x="14" y="14" width="192" height="382" rx="22" fill="url(#sh-phone)"/>

    <!-- Play triangle -->
    <path d="M85 175 L85 245 L150 210 Z" fill="#ffffff"/>

    <!-- Shorts label -->
    <text x="110" y="340" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Shorts</text>
  </g>

  <!-- Label -->
  <text x="600" y="570" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">YouTube Shorts Downloader</text>
  <text x="600" y="608" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#a3a3a3" text-anchor="middle">Save Shorts as MP4 in seconds</text>
</svg>
