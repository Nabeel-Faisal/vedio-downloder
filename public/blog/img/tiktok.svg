  <g transform="translate(540 200)" opacity="0.85">
    <path d="M120 0 C140 0 155 5 168 18 C180 30 188 48 188 70 L188 175 C188 215 158 245 118 245 C78 245 48 215 48 175 C48 154 65 137 86 137 C95 137 103 140 110 145 L110 90 C97 91 86 96 78 105 C68 117 62 132 62 150 L62 0 Z" fill="#25F4EE" filter="url(#tk-glow)"/>
  </g>

