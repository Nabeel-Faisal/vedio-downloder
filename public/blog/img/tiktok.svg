  <text x="600" y="540" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">TikTok Downloader</text>
  <text x="600" y="580" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#a3a3a3" text-anchor="middle">No watermark · Free · Fast</text>
